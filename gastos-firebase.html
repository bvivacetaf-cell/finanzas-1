<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos antes del pago</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14302c;--mute:#5b706c;--line:#d5dedc;--acc:#0f6b5c;--onacc:#fff;--warn:#b86e00;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#172623;--ink:#e6f0ee;--mute:#93aaa5;--line:#2a3d39;--acc:#4fd1b8;--onacc:#0f1a18;--warn:#f0b04a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main,#login{max-width:560px;margin:0 auto;padding:20px 16px 48px}
#login{max-width:380px;padding-top:12vh}
[hidden]{display:none!important}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.balance{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;margin:0}
.balance.neg{color:var(--bad)}
.lbl{color:var(--mute);font-size:.9rem;margin:0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;overflow-wrap:anywhere}
.item .t span{color:var(--mute);font-size:.85rem}
.item .m{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);margin:6px 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cats span{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>

<div id="login">
  <h1>Gastos antes del pago</h1>
  <p class="sub">Ingresa con tu correo y tu clave.</p>
  <div class="card">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label for="pass" style="margin-top:10px">Clave</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="enter" type="button" style="margin-top:4px">Entrar</button>
  </div>
</div>

<main id="app" hidden>
  <h1>Gastos antes del pago</h1>
  <p class="sub">Anota lo que gastas hasta que te paguen y mira cuánto te queda.</p>

  <section class="card" aria-live="polite">
    <p class="lbl" id="leftLbl">Te queda</p>
    <p class="balance" id="left">$0</p>
    <div class="bar"><i id="fill"></i></div>
    <p class="lbl" id="info"></p>
    <div class="cats" id="cats"></div>
  </section>

  <section class="card">
    <div class="row">
      <div><label for="budget">Dinero que tienes hasta el pago</label><input id="budget" type="number" inputmode="numeric" min="0" placeholder="Ej: 150000"></div>
      <div><label for="payday">Día de pago</label><input id="payday" type="date"></div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div><label for="amount">Monto</label><input id="amount" type="number" inputmode="numeric" min="1" placeholder="Ej: 4500"></div>
      <div><label for="cat">Categoría</label>
        <select id="cat"><option>Comida</option><option>Transporte</option><option>Salidas</option><option>Cuentas</option><option>Compras</option><option>Otro</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="desc">Detalle</label><input id="desc" type="text" maxlength="100" placeholder="Ej: almuerzo"></div>
      <div><label for="date">Fecha</label><input id="date" type="date"></div>
    </div>
    <p class="err" id="err2" role="alert"></p>
    <button class="btn" id="add" type="button" style="margin-top:4px">Agregar gasto</button>
  </section>

  <section class="card"><div id="list"></div></section>

  <button class="btn ghost" id="reset" type="button">Ya me pagaron: empezar nuevo ciclo</button>
  <button class="btn ghost" id="logout" type="button">Cerrar sesión</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendEmailVerification, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, setDoc, getDocs, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== PEGA AQUÍ LA CONFIGURACIÓN DE TU APP WEB DE FIREBASE ======
   Firebase Console > Configuración del proyecto > Tus apps > App web */
const firebaseConfig = {
  apiKey: "PEGA_AQUI",
  authDomain: "PEGA_AQUI",
  projectId: "PEGA_AQUI",
  appId: "PEGA_AQUI"
};
/* ================================================================== */

const $ = id => document.getElementById(id);
const fmt = new Intl.NumberFormat("es-CL", {style:"currency", currency:"CLP", maximumFractionDigits:0});
const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
const fdate = s => { const p = s.split("-"); return p[2] + "/" + p[1]; };
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

const configured = !Object.values(firebaseConfig).some(v => String(v).startsWith("PEGA_AQUI"));
let auth, db, uid = null, unsubs = [];
let state = {budget:0, payday:"", expenses:[]};

if (!configured) {
  $("err").textContent = "Falta pegar la configuración de Firebase en el archivo (busca PEGA AQUÍ).";
  $("enter").disabled = true;
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
}

function show(on){ $("login").hidden = on; $("app").hidden = !on; }

function render(){
  const total = state.expenses.reduce((a,e) => a + e.amount, 0);
  const b = Number(state.budget) || 0, left = b - total;
  const el = $("left");
  el.textContent = fmt.format(b ? left : total);
  el.className = "balance" + (b && left < 0 ? " neg" : "");
  $("leftLbl").textContent = b ? "Te queda" : "Has gastado";
  const pct = b ? Math.min(100, total / b * 100) : 0, f = $("fill");
  f.style.width = pct + "%";
  f.className = pct >= 100 ? "bad" : pct >= 80 ? "warn" : "";
  let info = b ? "Has gastado " + fmt.format(total) + " de " + fmt.format(b) + "." : "Ingresa cuánto dinero tienes para ver cuánto te queda.";
  if (state.payday) {
    const days = Math.round((new Date(state.payday + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
    if (days > 0) {
      info += " Faltan " + days + (days === 1 ? " día" : " días") + " para el pago";
      if (b && left > 0) info += ": puedes gastar unos " + fmt.format(Math.floor(left / days)) + " al día";
      info += ".";
    } else if (days === 0) info += " Hoy te pagan.";
    else info += " La fecha de pago ya pasó.";
  }
  $("info").textContent = info;
  const by = {};
  state.expenses.forEach(e => { by[e.cat] = (by[e.cat] || 0) + e.amount; });
  $("cats").innerHTML = Object.keys(by).map(k => "<span>" + esc(k) + " " + fmt.format(by[k]) + "</span>").join("");
  const list = state.expenses.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  $("list").innerHTML = list.length ? list.map(e =>
    '<div class="item"><div class="t"><b>' + esc(e.desc || e.cat) + '</b><span>' + esc(e.cat) + " · " + fdate(e.date) +
    '</span></div><div class="m">' + fmt.format(e.amount) + '</div><button class="x" data-id="' + esc(e.id) + '" aria-label="Eliminar gasto">×</button></div>').join("")
    : '<p class="empty">Aún no hay gastos. Agrega el primero arriba.</p>';
}

function listen(){
  const dbErr = () => { $("err2").textContent = "No se pudo leer o guardar en Firestore. Revisa las reglas y que tu correo esté verificado."; };
  unsubs.push(onSnapshot(collection(db, "users", uid, "expenses"), snap => {
    state.expenses = snap.docs.map(d => ({id:d.id, ...d.data()}));
    render();
  }, dbErr));
  unsubs.push(onSnapshot(doc(db, "users", uid, "config", "main"), snap => {
    const c = snap.exists() ? snap.data() : {budget:0, payday:""};
    state.budget = c.budget || 0; state.payday = c.payday || "";
    if (document.activeElement !== $("budget")) $("budget").value = state.budget || "";
    if (document.activeElement !== $("payday")) $("payday").value = state.payday;
    render();
  }, dbErr));
}
function stopListening(){ unsubs.forEach(u => u()); unsubs = []; state = {budget:0, payday:"", expenses:[]}; }

function saveConfig(){
  setDoc(doc(db, "users", uid, "config", "main"), {budget: Math.max(0, Math.round(Number(state.budget) || 0)), payday: state.payday || ""})
    .catch(() => { $("err2").textContent = "No se pudo guardar el saldo o el día de pago."; });
}

async function login(){
  $("err").textContent = "";
  $("enter").disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    if (!cred.user.emailVerified) {
      await sendEmailVerification(cred.user);
      await signOut(auth);
      $("err").textContent = "Te enviamos un correo para verificar tu cuenta. Verifícalo y vuelve a entrar.";
    }
    $("pass").value = "";
  } catch (e) {
    const bad = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"];
    $("err").textContent = bad.includes(e.code) ? "Correo o clave incorrectos."
      : e.code === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos."
      : "No se pudo entrar. Revisa tu conexión y la configuración de Firebase.";
  }
  $("enter").disabled = false;
}

if (configured) {
  onAuthStateChanged(auth, user => {
    stopListening();
    if (user && user.emailVerified) { uid = user.uid; show(true); listen(); }
    else { uid = null; show(false); }
  });
}

$("enter").onclick = login;
$("pass").onkeydown = $("email").onkeydown = ev => { if (ev.key === "Enter") login(); };
$("logout").onclick = () => signOut(auth);

$("add").onclick = async () => {
  $("err2").textContent = "";
  const a = Math.round(Number($("amount").value));
  if (!a || a <= 0) { $("amount").focus(); return; }
  try {
    await addDoc(collection(db, "users", uid, "expenses"), {amount:a, cat:$("cat").value, desc:$("desc").value.trim().slice(0,100), date:$("date").value || today()});
    $("amount").value = ""; $("desc").value = ""; $("amount").focus();
  } catch (e) { $("err2").textContent = "No se pudo guardar el gasto."; }
};
$("list").onclick = ev => {
  const id = ev.target.getAttribute && ev.target.getAttribute("data-id");
  if (id) deleteDoc(doc(db, "users", uid, "expenses", id)).catch(() => { $("err2").textContent = "No se pudo eliminar el gasto."; });
};
$("budget").oninput = function(){ state.budget = Number(this.value) || 0; render(); };
$("budget").onchange = saveConfig;
$("payday").onchange = function(){ state.payday = this.value; render(); saveConfig(); };
$("reset").onclick = async () => {
  if (state.expenses.length && !confirm("Se borrarán los gastos de este ciclo. ¿Empezar uno nuevo?")) return;
  try {
    const snap = await getDocs(collection(db, "users", uid, "expenses"));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    batch.set(doc(db, "users", uid, "config", "main"), {budget:0, payday:""});
    await batch.commit();
  } catch (e) { $("err2").textContent = "No se pudo empezar el nuevo ciclo."; }
};

$("date").value = today();
</script>
</body>
</html>
